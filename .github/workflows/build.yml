name: Build

on: push

jobs:
  build-deploy:

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build

      - name: Submit artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy page
        uses: actions/deploy-pages@v4
